name: Release

# Publishes a GitHub release, with the built site attached, whenever `main` gets a
# package.json version that has no release yet. Pushing a v* tag also works.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.exists != 'true'
        run: npm ci && npm test && npm run build
      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          (cd dist && zip -r "../bible-app-${TAG}.zip" .)
          notes=$(awk -v v="${TAG#v}" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          gh release create "$TAG" "bible-app-${TAG}.zip" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "${notes:-Release $TAG}"
